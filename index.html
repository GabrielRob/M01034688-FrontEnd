   <!DOCTYPE html>
   <html>
   <head>
     <meta charset="UTF-8">
     <title>After School Classes</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
     <script src="https://unpkg.com/vue@3.4.38/dist/vue.global.js"></script>
   </head>
   <body>
     <div id="app">
       <h1>{{ sitename }}</h1>
        <button v-on:click="showCart = !showCart" :disabled="cart.length === 0">
          <span class="fa-solid fa-cart-shopping"></span> Cart ({{ cart.length }})
        </button>
        <div v-if="!showCart">
          <label>Sort by:
            <select v-model="sortBy">
              <option value="subject">subject</option>
              <option value="location">Location</option>
              <option value="price">Price</option>
              <option value="space">Space</option>
            </select>
          </label>
          <label><input type="radio" value="asc" v-model="sortOrder"> Ascending</label>
          <label><input type="radio" value="desc" v-model="sortOrder"> Descending</label>
          <div v-for="lesson in sortedLessons" :key="lesson.id">
            <span :class="'fa ' + lesson.icon"></span>
            <h2>{{ lesson.subject }}</h2>
            <p>Location: {{ lesson.location }}</p>
            <p>Price: ${{ lesson.price }}</p>
            <p>Space: {{ lesson.space }}</p>
            <button v-on:click="addToCart(lesson)" :disabled="lesson.space === 0">
              Buy
            </button>
          </div>
        </div>
        <div v-else>
          <h2>Shopping Cart</h2>
          <div v-for="(id, index) in cart" :key="index">
            <p>{{ getLessons(id).subject }}, {{ getLessons(id).location }}, £{{ getLessons(id).price }}</p>
            <button v-on:click="removeFromCart(index)">Remove</button>
          </div>
          <h3>Checkout</h3>
            <label>Name: <input type="text" v-model="name"></label>
            <label>Phone: <input type="text" v-model="phone"></label>
            <button v-on:click="checkout" :disabled="!canCheckout">Checkout</button>
            <p v-if="orderMessage">{{orderMessage}}</p>

        </div>
     </div>
     <script type="module">
      const { createApp } = Vue
      const webstore = createApp({
      data() {
      return {
      sitename: "Tutoring lessons",
      showCart: false,
      name:"",
      phone:"",
      orderMessage:"",
      lessons: [
        {id: 1, subject: "Math", location: "London", price: 100, space: 5, icon: "fa-calculator"},
        {id: 2, subject: "Science", location: "New York", price: 120, space: 5, icon: "fa-flask"},
        {id: 3, subject: "English", location: "Paris", price: 90, space: 5, icon: "fa-book"},
        {id: 4, subject: "History", location: "Berlin", price: 110, space: 5, icon: "fa-landmark"},
        {id: 5, subject: "Art", location: "Rome", price: 95, space: 5, icon: "fa-paint-brush"},
        {id: 6, subject: "Music", location: "Vienna", price: 105, space: 5, icon: "fa-music"},
        {id: 7, subject: "Physical Education", location: "Sydney", price: 85, space: 5, icon: "fa-basketball"},
        {id: 8, subject: "Computer Science", location: "Tokyo", price: 130, space: 5, icon: "fa-laptop-code"},
        {id: 9, subject: "Drama", location: "Los Angeles", price: 115, space: 5, icon: "fa-theater-masks"},
        {id: 10, subject: "Economics", location: "London", price: 120, space: 5, icon: "fa-chart-line"},
        {id: 11, subject: "Philosophy", location: "Athens", price: 100, space: 5, icon: "fa-brain"}
      ],
      sortBy: "subject",
      sortOrder: "asc",
      cart:[]
    }
    },
      computed:{
        sortedLessons() {
          return [...this.lessons].sort((a,b) => {
            let x = a[this.sortBy]
            let y = b[this.sortBy]
            if (typeof x === "string") {
              x = x.toLowerCase()
              y = y.toLowerCase()
            }
            let result = x > y ? 1 : x < y ? -1 : 0
            return this.sortOrder === "asc" ? result : -result
          })
        },
        canCheckout(){
          const nameOK = /^[A-Za-z ]+$/.test(this.name)
          const phneOK = /^[0-9]+$/.test(this.phone)
          return nameOK && phneOK
        }
      },
      methods: {
        addToCart(lesson) {
          this.cart.push(lesson.id)
          lesson.space--
        },
        getLessons(id){
          return this.lessons.find(leson => leson.id === id)
        },
        removeFromCart(index) {
          const lesson = this.getLessons(this.cart[index])
          lesson.space++
          this.cart.splice(index, 1)
          if (this.cart.length === 0) this.showCart = false
        },
        checkout() {
          this.orderMessage = "Thank you " + this.name + ", your order has been submitted"
          this.cart = []
          this.name=""
          this.phone=""
        }
      }
})
  webstore.mount('#app')
</script>
   </body>
   </html>
